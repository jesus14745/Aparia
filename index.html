<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aparia · Para Ariana</title>
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fff7f0;--card:#ffffff;--tx:#3a1c20;--mu:#8a6f6a;--ac:#c8102e;--acx:#fff;--bd:#efdcc4;--gold:#c9a227;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0f13;--card:#2b171d;--tx:#fbefe8;--mu:#c9a9a0;--ac:#ff5a6e;--acx:#2a0a10;--bd:#4a2e24;--gold:#e0b84a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c0f13;--card:#2b171d;--tx:#fbefe8;--mu:#c9a9a0;--ac:#ff5a6e;--acx:#2a0a10;--bd:#4a2e24;--gold:#e0b84a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font:600 30px/1 Georgia,"Times New Roman",serif;letter-spacing:.5px;margin:6px 0 2px;color:var(--ac)}
.hrt{display:inline-block;color:var(--ac);animation:lat 1.6s ease-in-out infinite}
@keyframes lat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.hrt{animation:none}}
.for{font:italic 600 18px/1.2 Georgia,"Times New Roman",serif;color:var(--gold);margin:2px 0 4px}
.hdr{border-bottom:2px solid var(--gold);margin-bottom:14px;padding-bottom:8px}
nav button.on{border-top:2px solid var(--gold)}
main .card{border-top:3px solid var(--gold)}
.sub{color:var(--mu);font-size:14px;margin:0 0 14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:14px 4px;font-size:14px;font-family:inherit;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}
.btn.ghost{background:none;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer;font-family:inherit;display:inline-flex;gap:5px;align-items:center}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;touch-action:manipulation}
.it.pin{outline:3px solid var(--ac)}
.it img{width:100%;aspect-ratio:1;object-fit:contain;display:block;padding:6px;background:var(--bg)}
.it small{display:flex;align-items:center;gap:5px;padding:5px 7px;font-size:11px;color:var(--mu)}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--bd);display:inline-block;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:14px}
.lk{display:flex;gap:12px}
.det{flex:1;min-width:0}
.tag{font-weight:700;font-size:15px}
.sc{font-size:12px;color:var(--mu)}
.dsc{font-size:13px;color:var(--mu);margin:6px 0}
.heart{border:0;background:none;font-size:26px;cursor:pointer;color:var(--ac);padding:0}
.empty{text-align:center;color:var(--mu);padding:40px 12px}
.mq{position:relative;width:176px;flex:none;display:flex;flex-direction:column;align-items:center;background:var(--bg);border-radius:14px;padding:10px 0}
.mq .s{display:flex;justify-content:center;align-items:flex-end}
.mq img{object-fit:contain;display:block}
.hat{margin-bottom:-4px}
.up .o{margin-right:-34px}
.up .t{position:relative;z-index:1}
.lo{margin-top:-10px}
.sh{margin-top:-6px}
.ac{position:absolute;right:6px;bottom:70px}
select,input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
input[type=color]{width:44px;height:34px;border:0;padding:0;background:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.pv{background:conic-gradient(#ccc 25%,#eee 0 50%,#ccc 0 75%,#eee 0) 0 0/16px 16px;border-radius:14px;height:200px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.pv img{max-height:100%;max-width:100%;cursor:crosshair}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;display:none;z-index:20}
</style></head>
<body>
<main>
  <div class="hdr"><h1>Aparia <span class="hrt">♥</span></h1><p class="for">Para Ariana</p><p class="sub" style="margin:0">Tu armario, combinado con teoría del color.</p></div>
  <div id="view"></div>
</main>
<nav id="nav">
  <button data-tab="looks">✨ Looks</button>
  <button data-tab="closet">👚 Armario</button>
  <button data-tab="favs">♥ Favoritos</button>
</nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<input type="file" id="rfile" accept=".json,application/json" hidden>
<script>
/* Versión independiente: el respaldo se descarga como archivo desde el navegador */
const claude={use:async()=>({save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=filename;document.body.appendChild(a);a.click();a.remove();return{status:"saved"}}})};
const CATS={top:"Suéter / top",bottom:"Pantalón / falda",shoes:"Calzado",outer:"Abrigo",hat:"Gorro",acc:"Accesorio"};
const SEAS={all:"Todo el año",cold:"Frío",hot:"Calor"},OCC={casual:"Casual",work:"Trabajo",out:"Salida"};
const S={items:[],favs:[],tab:"looks",filter:"all",pin:null,looks:[],season:"all",occ:"any"};
let D=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2400)}
function load(){try{const d=JSON.parse(localStorage.getItem("aparia:v1")||"{}");S.items=d.items||[];S.favs=d.favs||[]}catch(e){}}
function save(){try{localStorage.setItem("aparia:v1",JSON.stringify({items:S.items,favs:S.favs}))}catch(e){toast("No se pudo guardar: almacenamiento lleno")}}

/* ---------- color ---------- */
function hsl(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}
  return{h,s,l}}
const hd=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d};
const isNeutral=c=>c.s<.18||c.l<.14||c.l>.9;
function score(set){
  const ch=set.map(i=>hsl(i.hex)).filter(c=>!isNeutral(c));
  let s,t,d;
  if(!ch.length){s=88;t="Neutro total";d="Combinación segura y elegante: juega con texturas y siluetas."}
  else{
    let mx=0;for(const a of ch)for(const b of ch)mx=Math.max(mx,hd(a.h,b.h));
    if(mx<=15){s=ch.length===1?93:91;t=ch.length===1?"Neutros + un color protagonista":"Monocromático";d=ch.length===1?"Un solo acento sobre base neutra: la regla de oro.":"Mismo tono en distintas intensidades: se ve estilizado."}
    else if(mx<=45){s=82;t="Análogo";d="Colores vecinos en el círculo cromático: armonía suave y natural."}
    else if(mx>=150&&mx<=210&&ch.length<=2){s=84;t="Complementario";d="Colores opuestos: contraste vibrante. Que uno domine y el otro acentúe."}
    else if(mx>=100&&mx<150&&ch.length<=3){s=70;t="Triádico suave";d="Tres tonos equilibrados: atrevido, mejor si bajas la saturación de uno."}
    else{s=38;t="Tensión de color";d="Muchos tonos compiten. Prueba cambiar una prenda por un neutro."}
    if(ch.filter(c=>c.s>.65).length>1)s-=10;
  }
  const np=set.filter(i=>i.patt==="print").length;
  if(np>1){s-=18;d+=" Varios estampados compiten: deja solo uno."}else if(np===1)d+=" Un solo estampado sobre piezas lisas: buen equilibrio.";
  return{s:Math.max(5,Math.min(99,s+set.length)),t,d}
}

/* ---------- looks ---------- */
const okItem=i=>(S.season==="all"||!i.season||i.season==="all"||i.season===S.season)&&(S.occ==="any"||!(i.occ&&i.occ.length)||i.occ.includes(S.occ));
function gen(){
  const pin=S.items.find(i=>i.id===S.pin),pool=S.items.filter(i=>okItem(i)||(pin&&i.id===pin.id));
  const by=c=>pool.filter(i=>i.cat===c),tops=by("top"),bots=by("bottom");
  if(!tops.length||!bots.length)return null;
  const pick=a=>a[Math.random()*a.length|0],seen=new Set(),out=[];
  const po=S.season==="cold"?.85:S.season==="hot"?0:.5;
  for(let n=0;n<400;n++){
    const set=[pick(tops),pick(bots)];
    [["shoes",.9],["outer",po],["hat",.4],["acc",.5]].forEach(([c,p])=>{const a=by(c);if(a.length&&Math.random()<p)set.push(pick(a))});
    if(pin){const k=set.findIndex(i=>i.cat===pin.cat);if(k>=0)set[k]=pin;else set.push(pin)}
    const key=set.map(i=>i.id).sort().join();if(seen.has(key))continue;seen.add(key);
    out.push({set,...score(set)});
  }
  return out.sort((a,b)=>b.s-a.s).slice(0,12);
}
const favKey=set=>set.map(i=>i.id).sort().join();
function mq(set){
  const g=c=>set.find(i=>i.cat===c),im=(i,w,h)=>i?`<img src="${i.img}" alt="" style="width:${Math.round(w*(i.sc||1))}px;max-height:${Math.round(h*(i.sc||1))}px">`:"";
  const hat=g("hat"),top=g("top"),out=g("outer"),bot=g("bottom"),sh=g("shoes"),ac=g("acc");
  return `<div class="mq">${hat?`<div class="s hat">${im(hat,56,48)}</div>`:""}
  <div class="s up">${out?`<div class="o">${im(out,104,130)}</div>`:""}<div class="t">${im(top,out?88:98,120)}</div></div>
  <div class="s lo">${im(bot,92,190)}</div>${sh?`<div class="s sh">${im(sh,84,50)}</div>`:""}${ac?`<div class="ac">${im(ac,40,40)}</div>`:""}</div>`;
}
function lookCard(l,idx,fav){
  const dots=l.set.map(i=>`<span class="dot" style="background:${i.hex}"></span>`).join("");
  const on=fav||S.favs.includes(favKey(l.set));
  return `<div class="card"><div class="lk">${mq(l.set)}<div class="det">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px"><div><div class="tag">${l.t}</div><div class="sc">${dots} Armonía ${l.s}/100</div></div>
  <button class="heart" data-act="fav" data-i="${idx}" data-from="${fav?"favs":"looks"}">${on?"♥":"♡"}</button></div>
  <p class="dsc">${l.d}</p></div></div></div>`;
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  const v=$("#view");
  if(S.tab==="closet"){
    const list=S.items.filter(i=>S.filter==="all"||i.cat===S.filter);
    v.innerHTML=`<div class="row"><button class="btn" data-act="add">📷 Escanear prenda</button><button class="btn ghost" data-act="backup">⬇ Respaldar</button><button class="btn ghost" data-act="restore">⬆ Restaurar</button></div>
    <div class="chips">${["all",...Object.keys(CATS)].map(c=>`<button class="chip ${S.filter===c?"on":""}" data-act="filter" data-c="${c}">${c==="all"?"Todo":CATS[c]}</button>`).join("")}</div>
    ${list.length?`<div class="grid">${list.map(i=>`<div class="it ${S.pin===i.id?"pin":""}" data-act="item" data-id="${i.id}"><img src="${i.img}" alt=""><small><span class="dot" style="background:${i.hex}"></span>${esc(i.name||CATS[i.cat])}${i.patt==="print"?" ✦":""}</small></div>`).join("")}</div>
    <p class="sub" style="margin-top:12px">Toca una prenda para editarla, eliminarla o fijarla en los looks.</p>`
    :`<div class="empty">Aún no hay prendas.<br>Fotografía cada prenda sobre un fondo liso y la app la recorta sola.</div>`}`;
    
  }else if(S.tab==="looks"){
    const pin=S.items.find(i=>i.id===S.pin);
    const has=S.items.some(i=>i.cat==="top")&&S.items.some(i=>i.cat==="bottom");
    const body=!has?`<div class="empty">Agrega al menos un top y un pantalón o falda en Armario.</div>`
      :S.looks===null?`<div class="empty">No hay prendas suficientes para esa temporada u ocasión. Prueba con “Todo el año” / “Cualquiera”.</div>`
      :S.looks.length?S.looks.map((l,i)=>lookCard(l,i,false)).join(""):`<div class="empty">Pulsa “Generar looks” para ver outfits ordenados de mejor a menor armonía.</div>`;
    v.innerHTML=`<div class="row"><button class="btn" data-act="gen">✨ ${S.looks&&S.looks.length?"Otras combinaciones":"Generar looks"}</button>
    ${pin?`<button class="chip on" data-act="unpin">Fijada: ${esc(pin.name||CATS[pin.cat])} ✕</button>`:""}</div>
    <div class="row"><select id="fseas" style="flex:1">${Object.entries(SEAS).map(([k,t])=>`<option value="${k}" ${S.season===k?"selected":""}>${t}</option>`).join("")}</select>
    <select id="focc" style="flex:1"><option value="any">Cualquier ocasión</option>${Object.entries(OCC).map(([k,t])=>`<option value="${k}" ${S.occ===k?"selected":""}>${t}</option>`).join("")}</select></div>${body}`;
  }else{
    const fl=S.favs.map(k=>{const set=k.split(",").map(id=>S.items.find(i=>i.id===id)).filter(Boolean);return set.length>=2?{set,...score(set)}:null}).filter(Boolean);
    v.innerHTML=fl.length?fl.map((l,i)=>lookCard(l,i,true)).join(""):`<div class="empty">Tus looks favoritos aparecerán aquí.</div>`;
  }
}

/* ---------- recorte de prenda (sin servidor) ---------- */
function startDraft(im){
  const k=Math.min(1,300/Math.max(im.width,im.height)),w=Math.max(1,im.width*k|0),h=Math.max(1,im.height*k|0);
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0,w,h);
  const px=x.getImageData(0,0,w,h).data,R=[],G=[],B=[];
  const add=i=>{R.push(px[i*4]);G.push(px[i*4+1]);B.push(px[i*4+2])};
  for(let i=0;i<w;i++){add(i);add((h-1)*w+i)}for(let j=0;j<h;j++){add(j*w);add(j*w+w-1)}
  const med=a=>a.sort((p,q)=>p-q)[a.length>>1];
  D={w,h,px,bg:[med(R),med(G),med(B)],tol:34,taps:[],hex:"#888888",edited:false};
  process();openModal();
}
function flood(mask,ref,starts,t2){
  const{w,h,px}=D,st=[];
  const near=i=>{const a=px[i*4]-ref[0],b=px[i*4+1]-ref[1],c=px[i*4+2]-ref[2];return a*a+b*b+c*c<=t2};
  for(const s of starts)if(!mask[s]&&near(s)){mask[s]=1;st.push(s)}
  while(st.length){const p=st.pop(),x=p%w,y=p/w|0;
    for(const q of[x>0?p-1:-1,x<w-1?p+1:-1,y>0?p-w:-1,y<h-1?p+w:-1])if(q>=0&&!mask[q]&&near(q)){mask[q]=1;st.push(q)}}
}
function process(){
  const{w,h,px}=D,mask=new Uint8Array(w*h),t2=D.tol*D.tol,bd=[];
  for(let i=0;i<w;i++)bd.push(i,(h-1)*w+i);for(let j=0;j<h;j++)bd.push(j*w,j*w+w-1);
  flood(mask,D.bg,bd,t2);
  for(const t of D.taps)flood(mask,[px[t*4],px[t*4+1],px[t*4+2]],[t],t2);
  const o=new ImageData(w,h);let x0=w,y0=h,x1=-1,y1=-1,r=0,g=0,b=0,n=0;
  for(let i=0;i<w*h;i++){if(mask[i])continue;const x=i%w,y=i/w|0;
    const ed=(x>0&&mask[i-1])||(x<w-1&&mask[i+1])||(y>0&&mask[i-w])||(y<h-1&&mask[i+w]);
    o.data[i*4]=px[i*4];o.data[i*4+1]=px[i*4+1];o.data[i*4+2]=px[i*4+2];o.data[i*4+3]=ed?150:255;
    if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
    if(!ed){r+=px[i*4];g+=px[i*4+1];b+=px[i*4+2];n++}}
  if(x1<0||n<w*h*.02){x0=0;y0=0;x1=w-1;y1=h-1;for(let i=0;i<w*h;i++){o.data[i*4]=px[i*4];o.data[i*4+1]=px[i*4+1];o.data[i*4+2]=px[i*4+2];o.data[i*4+3]=255;r+=px[i*4];g+=px[i*4+1];b+=px[i*4+2]}n=w*h}
  const full=document.createElement("canvas");full.width=w;full.height=h;full.getContext("2d").putImageData(o,0,0);
  const bw=x1-x0+1,bh=y1-y0+1,k=Math.min(1,220/Math.max(bw,bh)),out=document.createElement("canvas");
  out.width=Math.max(1,bw*k|0);out.height=Math.max(1,bh*k|0);out.getContext("2d").drawImage(full,x0,y0,bw,bh,0,0,out.width,out.height);
  D.out=out;D.box={x0,y0,bw,bh};
  if(!D.edited)D.hex="#"+[r,g,b].map(v=>Math.round(v/n).toString(16).padStart(2,"0")).join("");
}
function updatePreview(){$("#pv").innerHTML=`<img id="pvi" src="${D.out.toDataURL("image/png")}" alt="">`;$("#dcol").value=D.hex}
function openModal(){
  $("#sheet").innerHTML=`<div class="pv" id="pv"></div>
  <p class="sc" style="margin:0 0 6px">Toca el fondo que haya quedado para quitarlo. Ajusta la sensibilidad si el recorte sale incompleto.</p>
  <input type="range" id="tol" min="8" max="90" value="${D.tol}" style="width:100%">
  <div class="row"><button class="chip" data-act="undo">↶ Deshacer</button><button class="chip" data-act="reset">Reiniciar</button><span class="sc" style="margin-left:auto">Color</span><input type="color" id="dcol"></div>
  ${fields({cat:"top",season:"all",sc:1})}
  <div class="row" style="margin:10px 0 0"><button class="btn" data-act="saveitem">Guardar</button><button class="btn ghost" data-act="cancel">Cancelar</button></div>`;
  $("#modal").classList.add("on");updatePreview();
}
function readFile(f){
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(u);startDraft(im)};
  im.onerror=()=>toast("No se pudo leer la imagen");im.src=u;
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const nb=e.target.closest("nav button");if(nb){S.tab=nb.dataset.tab;render();return}
  if(e.target.id==="pvi"&&D){const r=e.target.getBoundingClientRect(),b=D.box;
    const x=Math.min(D.w-1,Math.max(0,Math.round(b.x0+(e.clientX-r.left)/r.width*b.bw))),y=Math.min(D.h-1,Math.max(0,Math.round(b.y0+(e.clientY-r.top)/r.height*b.bh)));
    D.taps.push(y*D.w+x);process();updatePreview();return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act;
  if(act==="add"){$("#file").value="";$("#file").click()}
  else if(act==="filter"){S.filter=a.dataset.c;render()}
  else if(act==="pin"){S.pin=S.pin===a.dataset.id?null:a.dataset.id;S.looks=[];closeM();toast(S.pin?"Prenda fijada: ve a Looks":"Prenda desfijada");render()}
  else if(act==="unpin"){S.pin=null;S.looks=gen();render()}
  else if(act==="gen"){S.looks=gen();render()}
  else if(act==="undo"){D.taps.pop();process();updatePreview()}
  else if(act==="reset"){D.taps=[];D.edited=false;D.tol=34;$("#tol").value=34;process();updatePreview()}
  else if(act==="fav"){
    const i=+a.dataset.i,key=a.dataset.from==="favs"?S.favs[i]:favKey(S.looks[i].set);
    S.favs=S.favs.includes(key)?S.favs.filter(k=>k!==key):[...S.favs,key];save();render();
  }
  else if(act==="saveitem"){
    S.items.push({id:"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),hex:$("#dcol").value,img:D.out.toDataURL("image/webp",.85),...readFields()});
    save();$("#modal").classList.remove("on");D=null;S.tab="closet";S.looks=[];render();toast("Prenda guardada");
  }
  else if(act==="cancel"){$("#modal").classList.remove("on");D=null}
  else if(act==="item")openItem(a.dataset.id);
  else if(act==="delask")openItem(a.dataset.id,true);
  else if(act==="edit")openEdit(a.dataset.id);
  else if(act==="delyes"){const id=a.dataset.id;S.items=S.items.filter(x=>x.id!==id);S.favs=S.favs.filter(k=>!k.split(",").includes(id));if(S.pin===id)S.pin=null;S.looks=[];save();closeM();render();toast("Prenda eliminada")}
  else if(act==="saveedit"){const i=S.items.find(x=>x.id===a.dataset.id);if(i){Object.assign(i,readFields(),{hex:$("#dcol").value});save();S.looks=[];closeM();render();toast("Cambios guardados")}}
  else if(act==="share")shareLink();
  else if(act==="backup")backup();
  else if(act==="restore"){$("#rfile").value="";$("#rfile").click()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="tol"&&D){D.tol=+e.target.value;process();updatePreview()}
  else if(e.target.id==="dcol"&&D){D.hex=e.target.value;D.edited=true}
});
document.addEventListener("change",e=>{
  if(e.target.id==="fseas"){S.season=e.target.value;S.looks=gen();render()}
  else if(e.target.id==="focc"){S.occ=e.target.value;S.looks=gen();render()}
});
$("#file").addEventListener("change",e=>{const f=e.target.files[0];if(f)readFile(f)});
const LINK="https://claude.ai/artifact/VfFKrcdBrqAEGBDu3cJxkX";
async function shareLink(){
  try{if(navigator.share){await navigator.share({title:"Aparia · Para Ariana",text:"Mira Aparia ♥",url:LINK});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(LINK);toast("Enlace copiado ♥");return}catch(e){}
  $("#sheet").innerHTML=`<div class="tag" style="margin-bottom:6px">Copia este enlace</div><input type="text" id="lk" readonly value="${LINK}"><div class="row" style="margin-top:8px"><button class="btn" data-act="cancel">Cerrar</button></div>`;
  $("#modal").classList.add("on");setTimeout(()=>{const i=$("#lk");if(i){i.focus();i.select()}},50);
}
function closeM(){$("#modal").classList.remove("on");D=null}
function fields(v){
  return `<select id="dcat">${Object.entries(CATS).map(([k,t])=>`<option value="${k}" ${v.cat===k?"selected":""}>${t}</option>`).join("")}</select>
  <div class="row" style="margin:0"><select id="dpat" style="flex:1"><option value="solid">Liso</option><option value="print" ${v.patt==="print"?"selected":""}>Estampado</option></select>
  <select id="dseas" style="flex:1">${Object.entries(SEAS).map(([k,t])=>`<option value="${k}" ${v.season===k?"selected":""}>${t}</option>`).join("")}</select></div>
  <div class="row" style="margin:6px 0">${Object.entries(OCC).map(([k,t])=>`<label class="chip"><input type="checkbox" class="docc" value="${k}" ${(v.occ||[]).includes(k)?"checked":""}>${t}</label>`).join("")}<span class="sc">(sin marcar = sirve para todo)</span></div>
  <label class="sc">Tamaño en el look (si se ve muy grande o chica en el maniquí)<input type="range" id="dsc" min="60" max="140" value="${Math.round((v.sc||1)*100)}" style="width:100%"></label>
  <input type="text" id="dname" placeholder="Nombre (opcional), ej. Suéter crema" value="${esc(v.name||"")}">`;
}
function readFields(){return{cat:$("#dcat").value,patt:$("#dpat").value,season:$("#dseas").value,occ:[...document.querySelectorAll(".docc:checked")].map(c=>c.value),sc:+$("#dsc").value/100,name:$("#dname").value.trim().slice(0,30)}}
function openItem(id,ask){
  const i=S.items.find(x=>x.id===id);if(!i)return;
  $("#sheet").innerHTML=`<div class="pv" style="height:160px"><img src="${i.img}" alt="" style="cursor:default"></div>
  <div class="tag" style="margin-bottom:8px">${esc(i.name||CATS[i.cat])}</div>
  ${ask?`<p class="dsc">¿Eliminar esta prenda? No se puede deshacer.</p><div class="row"><button class="btn" data-act="delyes" data-id="${id}">Sí, eliminar</button><button class="btn ghost" data-act="item" data-id="${id}">No</button></div>`
  :`<div class="row"><button class="btn" data-act="edit" data-id="${id}">✏️ Editar</button><button class="btn ghost" data-act="delask" data-id="${id}">🗑 Eliminar</button></div>
  <div class="row"><button class="btn ghost" data-act="pin" data-id="${id}">📌 ${S.pin===id?"Quitar fijada":"Fijar en los looks"}</button><button class="chip" data-act="cancel">Cerrar</button></div>`}`;
  $("#modal").classList.add("on");
}
function openEdit(id){
  const i=S.items.find(x=>x.id===id);if(!i)return;
  $("#sheet").innerHTML=`<div class="pv" style="height:150px"><img src="${i.img}" alt="" style="cursor:default"></div>
  <div class="row"><span class="sc">Color</span><input type="color" id="dcol" value="${i.hex}"></div>${fields(i)}
  <div class="row" style="margin:10px 0 0"><button class="btn" data-act="saveedit" data-id="${id}">Guardar cambios</button><button class="btn ghost" data-act="item" data-id="${id}">Volver</button></div>`;
}
async function backup(){
  if(!S.items.length){toast("Aún no hay prendas para respaldar");return}
  let dl=null;try{dl=await claude.use("downloads")}catch(e){}
  if(!dl){toast("El respaldo no está disponible en esta vista");return}
  try{await dl.save({filename:"aparia-respaldo-"+new Date().toISOString().slice(0,10)+".json",data:JSON.stringify({app:"aparia",v:1,items:S.items,favs:S.favs})});toast("Respaldo listo ♥")}
  catch(e){if(!e||e.code!=="declined")toast("No se pudo guardar el respaldo")}
}
$("#rfile").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=="aparia"||!Array.isArray(d.items))throw 0;
    const ids=new Set(S.items.map(i=>i.id));let n=0;
    for(const i of d.items)if(i&&i.id&&i.img&&!ids.has(i.id)){S.items.push(i);n++}
    S.favs=[...new Set([...S.favs,...(d.favs||[])])];save();S.looks=[];render();toast(n+" prendas restauradas")}
  catch(x){toast("Ese archivo no es un respaldo de Aparia")}};
  r.readAsText(f)});
load();render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{"serviceWorker"in navigator&&navigator.serviceWorker.register("sw.js")}catch(e){}
</script>
</body></html>
